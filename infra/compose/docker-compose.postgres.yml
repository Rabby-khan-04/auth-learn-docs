services:
  db:
    image: postgres:16
    container_name: auth-learn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: authlearn
      POSTGRES_PASSWORD: authlearn
      POSTGRES_DB: authlearn
    ports:
      - "5433:5432"
    volumes:
      - auth_learn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authlearn -d authlearn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_learn_pg:
